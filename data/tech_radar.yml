# DfE Tech Radar data.
#
# This single file drives the whole radar: the interactive radar page, the
# per-area pages and the tables. To add or move a technology edit the
# `entries` list at the bottom and raise a pull request.
#
# Entry fields:
#   name   (required) Name of the technology
#   area   (required) One of the area ids below
#   ring   (required) adopt | trial | assess | hold
#   core   (optional) true if part of the core DfE software delivery stack
#   note   (optional) Short plain-English guidance shown in the detail panel
#   link   (optional) Internal guidance page, e.g. /infrastructure/docker/
#
# NOTE: ring placements are a DRAFT proposal and need review by the tech community.

meta:
  edit_url: https://github.com/DFE-Digital/technical-guidance/edit/master/data/tech_radar.yml
  issues_url: https://github.com/DFE-Digital/technical-guidance/issues/new
  slack: "#tech-community"
  base_path: /tech-radar/
  status: Draft
  updated: May 2026

rings:
  - id: adopt
    name: Adopt
    description: "Recommended for use by most teams. It is well supported and proven in DfE."
  - id: trial
    name: Trial
    description: "Proven for specific use cases. Fine to use in production where it fits, but check with your architect or the community first."
  - id: assess
    name: Assess
    description: "Worth exploring. Some teams use it in experiments or by exception. Production use carries higher risk because in-house knowledge and support are limited."
  - id: hold
    name: Hold
    description: "Do not use for new work. If you already use it, plan a move to a supported alternative."

# Quadrants are drawn clockwise from the top right. Each has a colour AND a
# shape so the radar does not rely on colour alone (circle, square, triangle, diamond).
quadrants:
  - id: languages-frameworks
    name: Languages & Frameworks
    colour: "#4c2c92"
    shape: circle
    description: "Programming languages, frameworks and runtimes that services are built with."
  - id: platforms-infrastructure
    name: Platforms & Infrastructure
    colour: "#0f7a73"
    shape: square
    description: "Where services are hosted and how infrastructure, containers and pipelines are run."
  - id: tools-delivery
    name: Tools & Delivery
    colour: "#a8266b"
    shape: triangle
    description: "Tools that teams use day to day to build, test, design and ship software."
  - id: data-ai
    name: Data, Analytics & AI
    colour: "#8a5a00"
    shape: diamond
    description: "Databases, analytics and reporting platforms, and AI tools."

areas:
  - id: cloud-platforms
    name: Cloud platforms
    quadrant: platforms-infrastructure
    description: "Public cloud and platform-as-a-service offerings used across the department."
  - id: devops-iac
    name: DevOps & infrastructure as code
    quadrant: platforms-infrastructure
    description: "Containers, orchestration, infrastructure as code, CI/CD, release and monitoring."
  - id: languages
    name: Programming languages
    quadrant: languages-frameworks
    description: "Programming and scripting languages used to build and automate services."
  - id: frameworks-runtimes
    name: Frameworks & runtimes
    quadrant: languages-frameworks
    description: "Application frameworks, runtimes, SDKs and application servers."
  - id: source-control
    name: Source control
    quadrant: tools-delivery
    description: "Source control platforms and the clients people use to work with them."
  - id: ides-editors
    name: IDEs & editors
    quadrant: tools-delivery
    description: "Development environments and code editors."
  - id: api-tools
    name: API & integration tools
    quadrant: tools-delivery
    description: "Tools for designing, calling and testing APIs and integrations."
  - id: testing-quality
    name: Testing & quality
    quadrant: tools-delivery
    description: "Automated, performance and security testing tools."
  - id: architecture-design
    name: Architecture & design
    quadrant: tools-delivery
    description: "Diagramming, modelling, whiteboarding and design tools."
  - id: data-platforms
    name: Data & analytics platforms
    quadrant: data-ai
    description: "Databases, data engineering, reporting and analytics tools."
  - id: ai-tools
    name: AI & GenAI tools
    quadrant: data-ai
    description: "AI coding assistants, generative AI products and AI platforms."

